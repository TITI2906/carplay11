name: Build CarPlay IPA for TrollStore

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
build:
  runs-on: macos-14
   steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Install XcodeGen & ldid
        run: brew install xcodegen ldid

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Build Unsigned App
        run: |
          xcodebuild -project CustomCarPlay.xcodeproj \
            -scheme CustomCarPlay \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO

      - name: Inject CarPlay Entitlements & Package IPA
        run: |
          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/CustomCarPlay.app Payload/
          ldid -Sentitlements.plist Payload/CustomCarPlay.app/CustomCarPlay
          zip -r CustomCarPlay.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CustomCarPlay-IPA
          path: CustomCarPlay.ipa
